<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>निध्याक्षर · Nidhyakshar — निधि श्रीवास्तव की हिंदी कविताएँ</title>
<meta name="description" content="निध्याक्षर: निधि श्रीवास्तव की हिंदी कविताओं की डायरी, हर कविता के अंग्रेज़ी अनुवाद के साथ। A Hindi poetry journal by Nidhi Shrivastava, with English translations.">
<meta name="author" content="Nidhi Shrivastava">
<meta name="theme-color" content="#FBF5F0">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nidhyakshar">
<meta property="og:title" content="निध्याक्षर · Nidhyakshar">
<meta property="og:description" content="जहाँ एहसास, शब्द बन जाते हैं। Where feelings find their words. Hindi poetry by Nidhi Shrivastava.">
<meta property="og:locale" content="hi_IN">
<meta property="og:locale:alternate" content="en_IN">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Noto+Serif+Devanagari:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- Illustrations: sakura is the site's motif; the rose is kept for the मोहब्बत (Love) collection. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Slightly uneven edges, like watercolour on paper -->
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- One cherry blossom, centred on 0,0, about 50 units wide. Petal colour comes from the <use> fill. -->
    <g id="sk-flower">
      <g stroke="var(--rose-deep)" stroke-width=".7" stroke-linejoin="round">
        <path d="M0 -2 C -8 -7, -11 -17, -6 -23 L 0 -19.5 L 6 -23 C 11 -17, 8 -7, 0 -2 Z"/>
        <path transform="rotate(72)" d="M0 -2 C -8 -7, -11 -17, -6 -23 L 0 -19.5 L 6 -23 C 11 -17, 8 -7, 0 -2 Z"/>
        <path transform="rotate(144)" d="M0 -2 C -8 -7, -11 -17, -6 -23 L 0 -19.5 L 6 -23 C 11 -17, 8 -7, 0 -2 Z"/>
        <path transform="rotate(216)" d="M0 -2 C -8 -7, -11 -17, -6 -23 L 0 -19.5 L 6 -23 C 11 -17, 8 -7, 0 -2 Z"/>
        <path transform="rotate(288)" d="M0 -2 C -8 -7, -11 -17, -6 -23 L 0 -19.5 L 6 -23 C 11 -17, 8 -7, 0 -2 Z"/>
      </g>
      <path d="M0 0 L0 -9 M0 0 L6.5 -6.5 M0 0 L8.8 -1.5 M0 0 L5.5 6.8 M0 0 L-5.5 6.8 M0 0 L-8.8 -1.5 M0 0 L-6.5 -6.5" fill="none" stroke="var(--burgundy)" stroke-width=".7" stroke-linecap="round" opacity=".55"/>
      <g fill="var(--burgundy)" opacity=".7">
        <circle cx="0" cy="-9.6" r="1"/><circle cx="6.9" cy="-6.9" r="1"/><circle cx="9.3" cy="-1.6" r="1"/>
        <circle cx="5.8" cy="7.2" r="1"/><circle cx="-5.8" cy="7.2" r="1"/><circle cx="-9.3" cy="-1.6" r="1"/><circle cx="-6.9" cy="-6.9" r="1"/>
      </g>
      <circle r="2.6" fill="var(--gold)"/>
    </g>
    <g id="sk-bud">
      <path d="M0 -12 C 6 -8, 6 -1, 0 2 C -6 -1, -6 -8, 0 -12 Z" fill="var(--rose)" stroke="var(--rose-deep)" stroke-width=".7"/>
      <path d="M-4.5 0.5 L0 7 L4.5 0.5" fill="none" stroke="var(--bark)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- A long branch for the side margins (drawn for the left edge; mirrored for the right). -->
  <symbol id="sakura-branch" viewBox="0 0 300 600">
    <g fill="none" stroke="var(--bark)" stroke-linecap="round">
      <path stroke-width="5" d="M-6 8 C 60 40, 110 90, 140 170 C 165 235, 160 300, 190 370 C 210 420, 200 480, 230 560"/>
      <path stroke-width="2.4" d="M70 50 C 95 30, 130 25, 160 30"/>
      <path stroke-width="2.4" d="M135 160 C 170 150, 200 165, 230 150"/>
      <path stroke-width="2.2" d="M160 290 C 130 300, 105 320, 85 345"/>
      <path stroke-width="2" d="M190 370 C 220 360, 250 370, 270 355"/>
      <path stroke-width="2" d="M205 470 C 180 490, 165 515, 160 545"/>
    </g>
    <g filter="url(#wash)">
      <use href="#sk-flower" fill="var(--rose)" transform="translate(160 30) rotate(10) scale(1.15)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(126 22) rotate(-20) scale(.7)"/>
      <use href="#sk-bud" transform="translate(96 36) rotate(-30)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(232 150) rotate(25) scale(1.25)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(198 162) scale(.75)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(146 186) rotate(40) scale(.9)"/>
      <use href="#sk-bud" transform="translate(166 300) rotate(20)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(84 346) rotate(-15) scale(1.2)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(113 318) rotate(30) scale(.7)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(271 354) rotate(12) scale(1.05)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(240 366) scale(.65)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(160 546) rotate(-30) scale(1.15)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(181 504) scale(.7)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(231 562) rotate(20) scale(.9)"/>
      <use href="#sk-bud" transform="translate(58 44) rotate(-50) scale(.8)"/>
    </g>
  </symbol>

  <!-- A short sprig for the portrait -->
  <symbol id="sakura-sprig" viewBox="0 0 170 130">
    <g fill="none" stroke="var(--bark)" stroke-linecap="round">
      <path stroke-width="3" d="M172 8 C 120 30, 80 55, 18 72"/>
      <path stroke-width="1.8" d="M104 42 C 98 66, 98 86, 88 100"/>
    </g>
    <g filter="url(#wash)">
      <use href="#sk-flower" fill="var(--rose)" transform="translate(32 68) rotate(-10) scale(1.1)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(70 52) rotate(20) scale(.78)"/>
      <use href="#sk-flower" fill="var(--rose)" transform="translate(126 30) rotate(5) scale(.92)"/>
      <use href="#sk-flower" fill="var(--petal)" transform="translate(86 102) rotate(-25) scale(.92)"/>
      <use href="#sk-bud" transform="translate(154 16) rotate(60)"/>
      <use href="#sk-bud" transform="translate(100 78) rotate(-20) scale(.8)"/>
    </g>
  </symbol>

  <!-- A single blossom for small accents -->
  <symbol id="sakura-blossom" viewBox="-26 -26 52 52">
    <use href="#sk-flower" fill="var(--rose)"/>
  </symbol>

  <!-- The rose: only for the मोहब्बत (Love) collection -->
  <symbol id="rose" viewBox="0 0 200 260">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100 252 C 97 205, 104 165, 100 116"/>
      <path d="M99 196 C 72 188, 56 168, 52 146 C 76 150, 93 166, 99 196 Z"/>
      <path d="M99 196 C 82 180, 70 166, 60 154"/>
      <path d="M101 166 C 128 158, 144 138, 150 116 C 126 120, 108 138, 101 166 Z"/>
      <path d="M101 166 C 116 150, 128 136, 140 126"/>
      <path d="M86 112 L100 122 L114 112"/>
      <path d="M70 84 C 66 58, 86 40, 100 44 C 118 40, 138 58, 130 84 C 126 104, 112 114, 100 114 C 86 114, 73 104, 70 84 Z"/>
      <path d="M100 60 C 113 60, 119 71, 113 81 C 107 90, 92 89, 89 79 C 87 70, 95 65, 102 69 C 107 72, 105 78, 100 78"/>
      <path d="M78 68 C 86 76, 89 92, 84 106"/>
      <path d="M122 68 C 114 77, 111 93, 117 106"/>
      <path d="M90 47 C 95 54, 106 54, 111 46"/>
    </g>
  </symbol>
</svg>

<div class="sakura-side left" aria-hidden="true"><svg viewBox="0 0 300 600"><use href="#sakura-branch"/></svg></div>
<div class="sakura-side right" aria-hidden="true"><svg viewBox="0 0 300 600"><use href="#sakura-branch"/></svg></div>

<div class="wrap">
  <header class="site">
    <a class="logo" href="/" data-go="/" aria-label="Nidhyakshar">
      <span class="logo-hi">निध्याक्षर</span>
      <span class="logo-en">NIDHYAKSHAR</span>
    </a>
    <div class="nav-wrap">
      <nav class="main" id="nav" aria-label="Main"></nav>
      <div class="row">
        <div class="lang" role="group" aria-label="Language / भाषा">
          <button data-lang="hi" lang="hi">हिंदी</button>
          <button data-lang="en" lang="en">EN</button>
        </div>
        <button class="btn small primary" id="new-btn" hidden></button>
      </div>
    </div>
  </header>
  <main id="main">
    <noscript><p class="boot-error">निध्याक्षर पढ़ने के लिए JavaScript चालू करें। Please turn on JavaScript to read Nidhyakshar.</p></noscript>
  </main>
  <footer class="site" id="footer"></footer>
</div>
<button class="btn primary exit-reading" id="exit-reading"></button>

<script type="module" src="/app.js"></script>
</body>
</html>
